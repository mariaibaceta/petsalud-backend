# =====================================================================
#  Clínica PetSalud - Backend
#  Ningún secreto está escrito en este archivo: todo valor sensible se
#  lee desde variables de entorno (ver .env.example y README).
# =====================================================================
spring.application.name=backendpetsalud

# Permite cargar un archivo .env local (excluido de git) con las variables.
spring.config.import=optional:file:.env[.properties]

# Perfil por defecto: dev (carga usuarios de demostración). En producción: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# ---------------------------------------------------------------------
#  Base de datos (MySQL). Credenciales SOLO por variables de entorno.
#  En producción usar sslMode=VERIFY_IDENTITY con certificado del servidor.
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/petsalud_db?sslMode=PREFERRED&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El dialecto (MySQLDialect) lo detecta Hibernate automáticamente.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# No se registra SQL en consola (evita volcar datos personales en los logs).
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------
#  JWT (HMAC-SHA256). JWT_SECRET: Base64 de al menos 32 bytes (256 bits).
#  Generar con:  openssl rand -base64 48   (o: python3 -c "import secrets,base64;print(base64.b64encode(secrets.token_bytes(48)).decode())")
# ---------------------------------------------------------------------
seguridad.jwt.secreto=${JWT_SECRET}
seguridad.jwt.expiracion-minutos=${JWT_EXPIRATION_MINUTES:60}
seguridad.jwt.emisor=${JWT_ISSUER:petsalud-backend}

# Factor de costo de BCrypt (2^12 iteraciones).
seguridad.bcrypt.fuerza=12

# Bloqueo temporal tras intentos fallidos de login: 5 por email (cuenta) y 20 por IP (password spraying).
seguridad.login.max-intentos=5
seguridad.login.max-intentos-ip=20
seguridad.login.bloqueo-minutos=15

# CORS: orígenes permitidos separados por coma (frontends autorizados).
seguridad.cors.origenes-permitidos=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}

# ---------------------------------------------------------------------
#  Errores: nunca exponer trazas ni mensajes internos al cliente.
# ---------------------------------------------------------------------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Contraseña de los usuarios de demostración (solo perfiles dev/test). Vacía = se genera una aleatoria.
seguridad.demo.password=${DEMO_PASSWORD:}
